; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Lokale Zugangsdaten (nicht im Repo). Fehlt die Datei, gelten die Defaults unten.
extra_configs = secrets.ini
default_envs = nodemcu

; Defaults - werden von [secrets] in secrets.ini überschrieben
[secrets]
wifi_ssid    = DEIN_WLAN
wifi_pass    = DEIN_PASSWORT
ota_password = ota-passwort
ota_ip       = esp-logger.local
ap_password  = logger1234

[env]
platform = espressif8266
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, colorize, time
upload_speed = 921600
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	'-D SECRET_WIFI_SSID="${secrets.wifi_ssid}"'
	'-D SECRET_WIFI_PASS="${secrets.wifi_pass}"'
	'-D SECRET_OTA_PASSWORD="${secrets.ota_password}"'
	'-D SECRET_AP_PASSWORD="${secrets.ap_password}"'
lib_deps =
	esphome/ESPAsyncWebServer-esphome@^3.3.0
	adafruit/Adafruit BME280 Library@^2.2.2
	knolleary/PubSubClient@^2.8.0


[env:nodemcu]
board = nodemcuv2
; 4 MB Flash: ~1 MB Sketch + Platz für OTA, 2 MB Dateisystem für die Logs
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs


; Update über WLAN: pio run -e nodemcu_ota -t upload
; Vorher einmal per USB (env nodemcu) flashen, damit der OTA-Code drauf ist.
[env:nodemcu_ota]
extends = env:nodemcu
upload_protocol = espota
upload_port = ${secrets.ota_ip}
upload_flags =
	--auth=${secrets.ota_password}
